name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gofmt
        run: test -z "$(gofmt -l helper)"
      - name: vet
        run: cd helper && go vet ./...
      - name: test
        run: cd helper && go test ./...

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: tests
        run: node --test extension/tests/split.test.mjs
      - name: manifest is valid JSON
        run: python3 -c "import json;json.load(open('extension/manifest.json'))"

  build:
    runs-on: ubuntu-latest
    needs: [helper, extension]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: build
        run: VERSION="${GITHUB_REF_NAME}" ./install/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: awgbv-binaries
          path: |
            dist/awgbv-*
            dist/SHA256SUMS
